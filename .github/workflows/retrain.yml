name: Retrain models

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which model(s) to retrain
        type: choice
        options: [both, segmentation, classification]
        default: both
      epochs:
        description: Epoch override (keep small on CPU runners)
        type: number
        default: 2
  schedule:
    # Weekly refresh every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  contents: write

concurrency:
  group: dagshub-retrain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DAGSHUB_USER_NAME: ${{ secrets.DAGSHUB_USER_NAME }}
      DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
      MEDMLOPS_TRACKER: dagshub
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      EPOCHS: ${{ inputs.epochs || 2 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev,dagshub,dvc]"

      - name: Validate DagsHub credentials and configure DVC
        run: |
          if [ -z "$DAGSHUB_USER_NAME" ] || [ -z "$DAGSHUB_REPO_NAME" ] || [ -z "$DAGSHUB_USER_TOKEN" ]; then
            echo "::error::Set DAGSHUB_USER_NAME, DAGSHUB_REPO_NAME, and DAGSHUB_USER_TOKEN repository secrets."
            exit 1
          fi
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "$DAGSHUB_USER_NAME"
          dvc remote modify --local dagshub password "$DAGSHUB_USER_TOKEN"

      - name: Pull cached DVC data
        run: |
          if [ -f dvc.lock ]; then
            dvc pull
          else
            echo "No DVC lockfile yet; the selected preparation stages will create it."
          fi

      - name: Prepare ISIC 2018 with DVC
        if: inputs.target != 'classification'
        run: dvc repro prepare_segmentation

      - name: Prepare PneumoniaMNIST with DVC
        if: inputs.target != 'segmentation'
        run: dvc repro prepare_classification

      - name: Push prepared data to DagsHub
        run: dvc push

      - name: Train U-Net
        if: inputs.target != 'classification'
        run: medmlops train --config configs/isic_unet.yaml --dagshub --set "training.epochs=${EPOCHS}"

      - name: Train DenseNet-121
        if: inputs.target != 'segmentation'
        run: medmlops train --config configs/pneumonia_densenet.yaml --dagshub --set "training.epochs=${EPOCHS}"

      - name: Score ISIC test split
        if: inputs.target != 'classification'
        run: medmlops evaluate --config configs/isic_unet.yaml --split test

      - name: Score PneumoniaMNIST test split
        if: inputs.target != 'segmentation'
        run: medmlops evaluate --config configs/pneumonia_densenet.yaml --split test

      - name: Commit updated DVC lockfile
        run: |
          if [ -f dvc.lock ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dvc.lock
            if ! git diff --cached --quiet -- dvc.lock; then
              git commit -m "chore(dvc): update dataset lockfile"
              git push
            fi
          fi

      - name: Upload checkpoints, metrics and plots
        uses: actions/upload-artifact@v4
        with:
          name: medmlops-run-${{ github.run_id }}
          path: |
            artifacts/models/*.pt
            artifacts/models/*.json
            artifacts/figures/*.png
            metrics/*.json
          retention-days: 30
