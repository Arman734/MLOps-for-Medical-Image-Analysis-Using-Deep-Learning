[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medmlops"
version = "1.0.0"
description = "Reproducible MLOps platform for medical image analysis (U-Net lesion segmentation + DenseNet diagnosis) with MLflow, DVC, FastAPI and a custom clinical console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "mlflow>=3.0,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pillow>=10.4",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "prometheus-client>=0.21",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "medmnist>=3.0",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
dagshub = ["dagshub>=0.5"]
dvc = ["dvc>=3.55"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8"]
serve = ["huggingface-hub>=0.26"]

[project.scripts]
medmlops = "medmlops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medmlops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
